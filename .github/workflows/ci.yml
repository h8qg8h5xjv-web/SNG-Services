name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI run on a branch without a PR: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The scripts run TypeScript via `node --experimental-strip-types`
          # (Node ≥ 22.6) and @supabase/* needs Node ≥ 22. Same major as local dev.
          node-version: 24
          cache: npm
      - run: npm ci
      # Locale files must stay in sync — a missing key would otherwise only
      # surface at runtime (DESIGN §1).
      - run: npm run check:messages
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check:styles
      - run: npm test
      # Build with placeholder public values: no secrets in CI. The build does
      # not query Supabase (data pages render on demand), so an unreachable URL
      # is enough; a build that starts fetching at build time will fail here.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:1
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: 1
